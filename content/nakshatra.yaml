  - Поездки, транспорт, логистика, покупка автомобиля
  - 'Всё, что связано с воздухом и дыханием: практики, проветривание, спорт на выносливость'
  - 'Самостоятельные шаги: выйти из-под опеки, начать своё дело'
  - Публичность, распространение информации, реклама, рассылка
  - Гибкие договорённости, поиск компромисса

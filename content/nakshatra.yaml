# Накшатры: фон (из «Луна в накшатре») + благоприятно/осторожно (микс).
# Источник — рабочие документы владельца. Ключ = номер накшатры 1..27.

1:
  amplifies: реакция, скорость решений, интуиция первого впечатления, желание помогать, физическая бодрость.
  avoid:
  - Долгосрочные обязательства и всё, что «на десятилетия»
  - Дела, требующие терпения и медленной проработки
  - Решения на эмоции — импульс здесь опережает расчёт
  - длинные совещания, кропотливая правка, ожидание, ситуации, где нельзя ускорить процесс. Обещания на
    длинный срок — они даются искренне и выполняются тяжело
  distorts: терпение падает почти до нуля. Кажется, что всё делается быстро, — на деле оценка сроков занижена
    вдвое. Готовность вписаться в чужую проблему опережает оценку собственного ресурса.
  fon: 'Утро внутри головы, даже если на часах вечер. Ощущение чистого листа и лёгкого зуда в ногах: хочется
    куда-то ехать, что-то начинать, кому-то помочь. Энергии много, она не тяжёлая, но короткая — вспышками.'
  good:
  - Начинать новое — особенно то, что даст результат в ближайшие недели, а не годы
  - Начинать лечение, курс процедур, приём лекарств, восстановление после болезни
  - Короткие поездки, дорога, транспорт
  - Спорт, физическая нагрузка, первая тренировка
  - Быстрые сделки, покупки, обмен
  - Обучение новому навыку — именно старт, первый урок
  name: Ашвини
  tuning: Сегодня начинаю. Заканчивать буду не сегодня — и это нормально
2:
  amplifies: способность выдерживать неприятное, честность с собой, чувство меры и границы, физическая
    выносливость, воля к завершению.
  avoid:
  - Свадьбы, праздники, торжественные начинания
  - Первые встречи, знакомства, презентации
  - Мягкие переговоры — фон даёт жёсткость там, где нужна гибкость
  - знакомства, первые свидания, презентации, всё требующее лёгкости. Просьбы — сегодня отказ звучит жёстче
    обычного, и просить, и отказывать неудобно
  distorts: обострённая реакция на нарушение личных границ — реальное или мнимое. Склонность драматизировать
    и придавать окончательность тому, что окончательным не является. Ревность и собственничество.
  fon: 'Тяжелее и плотнее обычного. Не тоска, а вес: ощущение, что что-то давит и требует решения. Часто
    всплывают темы, которые давно хотелось не трогать. Эмоции глубокие, но не разлитые — сфокусированные.'
  good:
  - 'Завершать то, что затянулось: закрыть проект, вывезти хлам, расторгнуть договор'
  - Устанавливать границы — в работе, в семье, в деньгах
  - Тяжёлая физическая работа, генеральная уборка, разбор завалов
  - 'Работа с ограничениями: бюджет, регламент, дисциплина, отказ от привычки'
  - Изучение сложных, «тёмных» дисциплин — там, где нужна выдержка
  - Вопросы наследства, документов, всего связанного с уходом и передачей
  name: Бхарани
  tuning: Что здесь уже кончилось? Назову вслух — станет легче
3:
  amplifies: внимание к деталям, критическое мышление, способность отделять важное от лишнего, прямота,
    аппетит к работе.
  avoid:
  - Начало необычных, экспериментальных дел
  - Дела, требующие мягкости и дипломатии — легко перерезать лишнее
  - 'Публичная критика: сказанное здесь звучит острее, чем задумано'
  - 'творческий поиск, мягкие переговоры, воспитательные беседы с детьми, комплименты. Публичная обратная
    связь: она получится точной и обидной одновременно'
  distorts: соразмерность оценки. Мелкий недочёт кажется системной проблемой. Слова выходят острее, чем
    задумывались, — особенно в переписке, где не слышно интонации.
  fon: 'Внутренняя резкость. Видно недоделки — в чужой работе, в своей, в квартире, в отношениях. Раздражение
    приходит не от событий, а от несоответствия: «должно быть так, а оно вот так». Энергии много, она
    колючая.'
  good:
  - Проверки, аудит, ревизия, контроль качества
  - Критический разбор своей работы, редактура, доработка
  - 'Разделять и сортировать: файлы, товар, задачи, круг общения'
  - Работа с огнём и металлом, готовка, ремонт, инструмент
  - Прямой разговор, где нужно назвать вещи своими именами
  - Рутинная привычная деятельность — фон для неё ровный
  name: Криттика
  tuning: Я вижу дефект. Прежде чем сказать — решу, чинить или пропустить
4:
  amplifies: обаяние, способность нравиться и договариваться, чувство вкуса, работоспособность в спокойном
    режиме, ощущение опоры.
  avoid:
  - Разрыв связей и завершения — участок держит, а не отпускает
  - 'Спонтанные решения: здесь всё склеивается надолго, включая ошибки'
  - Переедание и лишние траты на удовольствия
  - разрывы, увольнения, отказы, отписки. Строгая диета и аскеза. Всё, где нужна жёсткость к себе или
    другим
  distorts: 'аппетит — во всех смыслах. Легко переесть, перетратить, пообещать больше, чем стоило. Комфорт
    становится критерием решения: приятное кажется правильным.'
  fon: 'Один из самых комфортных дней круга. Тепло, устойчиво, телесно приятно. Хочется вкусной еды, красивых
    вещей, спокойного вечера дома. Мир кажется дружелюбным, и это близко к правде: Луна здесь в максимальной
    силе.'
  good:
  - 'Закладка фундамента — буквального и переносного: дом, бизнес, новая работа'
  - Договоры на длительный срок, партнёрство, брак
  - Покупка земли, недвижимости, крупных активов
  - Посадка, сельское хозяйство, всё, что растёт
  - Начало лечения хронического заболевания
  - Переезд насовсем, включая другую страну
  name: Рохини
  tuning: То, что я делаю сегодня, будет со мной долго. Выбираю осознанно
5:
  amplifies: чутьё на людей и обстановку, обаяние в общении, восприимчивость к новому, вкус, способность
    улавливать нюанс.
  avoid:
  - Финальный выбор из вариантов — фон подталкивает искать дальше
  - Жёсткие ультиматумы и силовые ходы
  - Задачи, требующие долгой концентрации на одном
  - окончательный выбор, подписание, длинная монотонная задача, жёсткие переговоры. Всё, где нельзя передумать
  distorts: способность останавливаться на выбранном. Всегда кажется, что есть вариант лучше — и это ощущение
    не проходит после выбора. Легко распылиться и к вечеру не собрать ничего цельного.
  fon: 'Лёгкая непоседливость. Не тревога — любопытство. Внимание перескакивает: открылось семь вкладок,
    все интересные. Хочется гулять, общаться, пробовать, спрашивать. Настроение переменчивое, но в целом
    светлое.'
  good:
  - 'Поиск: работы, жилья, партнёра, поставщика, решения'
  - Сбор информации, исследование, изучение вариантов
  - Первые встречи, знакомства, дружеские контакты
  - Переговоры в тёплом ключе, обсуждения без давления
  - Творчество, музыка, пение, тонкая ручная работа
  - Путешествия и перемещения ради впечатлений
  name: Мригашира
  tuning: Сегодня собираю варианты. Решаю не сегодня
6:
  amplifies: аналитический ум, способность видеть сквозь фасад, честность в оценке ситуации, живучесть,
    работоспособность в кризисе.
  avoid:
  - 'Начало любых благих долгих дел: свадьба, новоселье, старт бизнеса'
  - Поездки без необходимости
  - Важные покупки — велика вероятность вернуться к вопросу
  - 'Разговоры на повышенных тонах: фон усиливает резкость'
  - праздники, знакомства, свадьбы, новоселья, старт бизнеса, крупные покупки. Переписка на эмоции. Разговоры
    с теми, кто дорог, — если можно отложить, лучше отложить
  distorts: масштаб. Мелкая неприятность разворачивается в катастрофу, брошенная фраза — в предательство.
    Сильный соблазн выяснить отношения именно сейчас, и он почти всегда преждевременный.
  fon: 'Напряжение. Внутри что-то натянуто, как перед грозой: раздражительность, обострённая чувствительность,
    иногда беспричинная тревога или, наоборот, странная ясность. Мысль работает быстро и остро, эмоция
    — резкими скачками.'
  good:
  - 'Разбор проблем: диагностика, поиск причины сбоя, расследование'
  - Демонтаж, снос, разрыв изживших себя схем
  - Жёсткие разговоры, которые давно откладывались
  - Интеллектуальная работа на пределе, сложный анализ, отладка
  - Исследование, наука, техника, всё связанное с электричеством и данными
  - Проработка страхов и старых травм — в терапии или самостоятельно
  name: Ардра
  tuning: Напряжение — это ресурс. Направлю его в задачу, а не в человека
7:
  amplifies: способность прощать и просить прощения, оптимизм, доверие к процессу, обучаемость, тяга к
    дому и корням.
  avoid:
  - Дела, где нужен один-единственный шанс и никаких повторов
  - Долговременные фиксированные обязательства — фон подвижный
  - 'Финальные закрытия: участок склонен возвращать, а не завершать'
  - окончательные разрывы, жёсткие ультиматумы, долгосрочная фиксация. Ситуации, где нужен один точный
    удар без права на повтор
  distorts: оценка второго шанса. Кажется, что можно вернуть и восстановить всё, включая то, что восстанавливать
    не стоит. Легко пообещать «начнём сначала» там, где здоровее закрыть.
  fon: 'Отпускает. После Ардры дышится свободнее: возвращается доброжелательность, ощущение, что всё поправимо.
    Хочется домой, к своим, к привычному. Настроение ровное, чуть ностальгическое.'
  good:
  - 'Возобновлять брошенное: проект, спорт, учёбу, отношения'
  - Возвращать долги и получать возвращённое
  - Второй заход на переговоры, которые сорвались
  - 'Восстановление: здоровья, порядка, репутации, связей'
  - Поездки, особенно возвращение домой; всё, что про дорогу
  - Обучение, преподавание, наставничество
  name: Пунарвасу
  tuning: 'Начать заново — не поражение. Но проверю: я возвращаюсь к делу или к привычке?'
8:
  amplifies: дисциплина, ответственность, желание заботиться, ясность приоритетов, способность держать
    режим.
  avoid:
  - Брачные церемонии — традиция это отдельно оговаривает
  - Начало изучения оккультных и «пограничных» дисциплин — фон слишком светлый
  - Резкие разрывы и агрессивные ходы
  - свадебные церемонии (традиция это отдельно оговаривает), рискованные авантюры, резкие разрывы, изучение
    пограничных дисциплин
  distorts: 'склонность взять на себя чужое. Забота легко переходит в опеку, а опека — в раздражение к
    вечеру: «я стараюсь, а они».'
  fon: 'Спокойная собранность. Не подъём и не спад — ровное состояние, в котором хорошо работается и легко
    о ком-то заботиться. Ощущение, что всё на своих местах. Традиция считает этот участок самым благоприятным
    в круге, и внутренне это так и переживается: без блеска, но надёжно.'
  good:
  - Практически любое благое начинание, если нет другого расчёта
  - Старт обучения, приём в ученики, работа с наставником
  - 'Финансовые операции: вклады, накопления, крупные покупки'
  - Начало лечения, оздоровительных программ, режима
  - Профессиональный старт, выход на новую должность
  - Дела, связанные с едой, домом, семьёй, заботой
  name: Пушья
  tuning: Сегодня закладываю основание. Простое и на каждый день
9:
  amplifies: интуиция, психологическое чутьё, способность видеть манипуляцию, концентрация на скрытом,
    память на детали разговора.
  avoid:
  - Праздники, свадьбы, публичные благие начинания
  - Доверие первому впечатлению и обещаниям
  - 'Крупные сделки: велика вероятность второго дна'
  - Тяжёлая пища, алкоголь, всё, что нагружает организм
  - праздники, знакомства, публичные выступления, крупные сделки с новыми людьми. Разговоры на эмоции.
    Тяжёлая еда и алкоголь
  distorts: доверие. Подозрение находит подтверждение даже там, где его нет. Обиды прошлого всплывают
    как свежие. Соблазн повлиять на человека обходным путём вместо прямого разговора.
  fon: 'Внутрь и вглубь. Не хочется на люди, зато отчётливо считываются мотивы: кто чего на самом деле
    хочет, что за словами. Восприятие обострённое, слегка подозрительное. Возможна вязкость: мысли ходят
    по кругу.'
  good:
  - 'Разбор мотивов: своих и чужих; понимание, что происходит на самом деле'
  - Глубинная работа с психикой, терапия, проработка зависимостей
  - Изучение эзотерических, медицинских, химических дисциплин
  - 'Стратегия и тактика: продумать ход, не раскрывая карт'
  - 'Работа с ядами в широком смысле: токсины, вредные привычки, токсичные связи'
  - Отсечение того, что незаметно тянет силы
  name: Ашлеша
  tuning: Я вижу подтекст. Прежде чем действовать — проверю, не сочинил ли я его
10:
  amplifies: чувство долга, ответственность за своих, связь с корнями, представительность, способность
    держать позицию.
  avoid:
  - Начало нового с нуля — фон смотрит назад, а не вперёд
  - Свадьбы и лёгкие праздники
  - 'Ситуации, где нужна гибкость: участок даёт негнущуюся позицию'
  - Споры о старшинстве и правоте
  - старт с нуля, лёгкие праздники, свадьбы, ситуации, требующие уступки. Просить об одолжении — сегодня
    это ощущается унизительнее, чем есть
  distorts: 'гибкость. Позиция становится принципиальной там, где вопрос не принципиальный. Обострённая
    реакция на статус: кто главнее, чьё слово весит.'
  fon: Ощущение веса и достоинства. Хочется, чтобы уважали; болезненно воспринимается пренебрежение. Часто
    приходят мысли о родителях, о роде, о том, «откуда я». Возможна ностальгия или, наоборот, тяжесть
    от старых семейных сюжетов.
  good:
  - 'Работа с прошлым: архив, документы, семейная история, старые записи'
  - Всё, связанное с наследством, недвижимостью рода, семейными обязательствами
  - 'Дань уважения: поминовение, благодарность старшим, забота о родителях'
  - 'Вопросы статуса и полномочий: назначения, передача дел, иерархия'
  - Тяжёлая, требующая силы работа
  - Завершение того, что тянется из прошлого
  name: Магха
  tuning: Я стою на чужом фундаменте. Что из этого я несу дальше, а что оставляю здесь?
11:
  amplifies: обаяние, творческое настроение, щедрость, способность радоваться, лёгкость в общении.
  avoid:
  - Начало долгих дисциплинированных проектов
  - Серьёзные переговоры, требующие холодной головы
  - 'Переоценка своих сил и трат: фон располагает к избытку'
  - Тяжёлый труд и вопросы, требующие смирения
  - старт дисциплинированного долгого проекта, аскеза, диета, жёсткие переговоры, тяжёлый труд. Крупные
    траты — оценка «я могу себе позволить» завышена
  distorts: 'оценка меры. Трата, порция, обещание, комплимент — всё выходит чуть больше нужного. Самооценка
    колеблется: то избыточная уверенность, то потребность в подтверждении.'
  fon: Хочется приятного. Работать — не очень, отдыхать — очень. Настроение тёплое, слегка ленивое, тянет
    к людям, к красоте, к удовольствию. Хорошо идут разговоры не по делу.
  good:
  - Отдых, восстановление, перерыв, отпуск
  - Творчество ради удовольствия — искусство, музыка, оформление
  - Праздники, застолья, приём гостей
  - Романтика, флирт, свидания
  - Уход за собой, красота, гардероб, интерьер
  - 'Договорённости о вознаграждении: обсуждение гонорара, доли, премии'
  name: Пурва Пхалгуни
  tuning: Разрешаю себе получить. Проверю только счёт
12:
  amplifies: надёжность, способность держать слово, дипломатичность, организаторская хватка, желание помогать
    без нарушения границ.
  avoid:
  - Разрыв и выход из обязательств — участок связывает
  - Спонтанные начинания без продуманных условий
  - Дела, требующие быстрой смены курса
  - выход из обязательств, увольнение, разрыв, отказ. Спонтанные шаги без прописанных условий
  distorts: оценка своей роли в чужих делах. Легко взять покровительство над тем, кто не просил. Возможно
    раздражение, если помощь не оценена.
  fon: Тёплая собранность. После расслабленности предыдущего участка возвращается ощущение обязательств
    — но не как груз, а как опора. Хочется договориться, оформить, зафиксировать. Отношение к людям доброжелательное

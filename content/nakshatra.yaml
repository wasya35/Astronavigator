  good:
  - Заключение договоров, партнёрских соглашений, брака
  - Оформление отношений в любой форме — юридической и человеческой
  - Начало работы, вступление в должность, приём обязательств
  - Долгосрочные вложения, покупка недвижимости
  - Благотворительность, помощь, покровительство
  - Организация процессов и структур, которые должны работать годами
  name: Уттара Пхалгуни
  tuning: Договорённость сильнее хорошего отношения. Запишу её
13:
  amplifies: мелкая моторика, аккуратность, умение договариваться о конкретике, память на детали, деловая
    хватка.
  avoid:
  - Абстрактное планирование без конкретных шагов
  - Крупные стратегические решения — участок про тактику
  - 'Мелочность и придирки: фон обостряет внимание к деталям'
  - стратегические сессии, философские разговоры, творческий поиск без задачи. Крупные решения на годы

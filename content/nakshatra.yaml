  distorts: масштаб внимания. Легко утонуть в деталях и не увидеть, что задача в целом идёт не туда. Придирчивость
    к чужой работе.
  fon: 'Рабочее, ловкое состояние. Руки чешутся что-то делать, и делается легко. Ум ясный, практичный,

  - 'Наращивать обороты: усилить кампанию, поднять активность'
  - Отделять важное от лишнего в потоке дел
  - 'Всё, связанное с водой: водные процедуры, поездки к воде, сантехника'
  - Тяжёлая работа, требующая упорства
  - Начало кампании, которую надо выиграть

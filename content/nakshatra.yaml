  - Начало дела, которое должно стоять десятилетиями
  - Вступление в должность, приём высокой ответственности
  - Брак, партнёрство, долгосрочный договор
  - Покупка недвижимости, закладка фундамента
  - Переезд насовсем, иммиграция

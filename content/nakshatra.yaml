  good:
  - Проектирование, чертёж, макет, дизайн, архитектура
  - 'Творчество, где важна форма: визуал, оформление, презентация'
  - Строительство и обустройство пространства
  - Покупка украшений, одежды, всего красивого
  - Публичное выступление, съёмка, всё, где нужно выглядеть
  - Мягкие переговоры, светские мероприятия
  name: Читра
  tuning: Форма — это тоже содержание. Но сначала проверю, есть ли что оформлять
15:
  amplifies: гибкость, коммерческое чутьё, дипломатия, способность лавировать, самостоятельность, умение

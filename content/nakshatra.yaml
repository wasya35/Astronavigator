  - Переезд насовсем — рискует превратиться в серию переездов
  - 'Хранение и накопление: здесь легче тратится, чем копится'
  - Чрезмерная опора на чужое мнение — участок про свою голову
  - фиксация надолго, переезд насовсем, крупные накопления, клятвы и обеты. Дела, где нужно упереться

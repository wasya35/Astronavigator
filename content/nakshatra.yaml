  good:
  - Ручная работа, ремесло, изготовление, ремонт, сборка
  - Практическое обучение и отработка навыка
  - Сделки, покупки, получение денег и документов на руки
  - Начало лечения, массаж, мануальные практики
  - Письмо, вёрстка, оформление, любая точная работа
  - Торговля, посредничество, договорённости о конкретике
  name: Хаста
  tuning: Сегодня — то, что можно взять в руки и закончить
14:
  amplifies: визуальное мышление, вкус, способность к проектированию, самопрезентация, ощущение композиции.
  avoid:
  - 'Дела, где важна суть, а не подача: легко увлечься оболочкой'
  - Крупные траты на внешнее
  - 'Резкие силовые ходы: участок мягкий, напор здесь неуместен'

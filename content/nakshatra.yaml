  - Групповая работа, командные проекты, мероприятия
  - 'Финансы: доходы, инвестиции, коммерческие решения'
  - Публичность, реклама, продвижение, объявления
  - Музыка, ритм, танец, спорт
  - Технические задачи, машины, оборудование
